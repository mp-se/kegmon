name: PlatformIO CI

on: 
  pull_request:
  push:
    branches: 
      - dev

jobs:
  pio-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags
          REV=`git rev-parse HEAD | rev | cut -c 1-6 | rev`
          TAG=`git tag --sort=creatordate | tail -1`
          echo "VITE_APP_BUILD=..$REV" >> .env
          echo "VITE_APP_VERSION=$TAG" >> .env
          cat .env
          npm install
          npm run build

      - name: Copy UI assets
        run: |
          cp ui/dist/assets/*.css.gz html/app.css.gz
          cp ui/dist/assets/*.js.gz html/app.js.gz

      - name: Setup PlatformIO
        uses: n-vr/setup-platformio-action@v1.0.1    
  
      #- name: Run PlatformIO
      #  run: pio run -e kegmon-release -e kegmon32s2-release

      - name: PlatformIO Run
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: "kegmon-release,kegmon32s2-release,kegmon32s3-release"
          #targets: "kegmon-release,kegmon32s2-release"
          #project-dir: "./some_dir"
          #project-conf: "./some_dir/custom.ini"
          jobs: 6
          silent: false
          verbose: true
          disable-auto-clean: false

      - uses: EndBug/add-and-commit@v9 # You can change this to use a specific version. https://github.com/marketplace/actions/add-commit
        if: ${{ github.event_name != 'pull_request' }}
        with:
          add: 'bin html'
          author_name: GitHub Action
          author_email: mp-se@noreply.github.com
          default_author: github_actor
          message: 'GitHub Action Build'
          pathspec_error_handling: ignore

