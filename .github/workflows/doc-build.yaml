name: Sphinx Build

on: 
  pull_request:
  push:
    branches: 
      - master

jobs:
  doc-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        working-directory: src_docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build documentation
        working-directory: src_docs
        run: sphinx-build -b html ./source ../docs

      - name: Commit documentation changes
        run: |
          pwd
          ls -al
          ls -al docs 
          git clone https://github.com/mp-se/kegmon.git --branch ghpages --single-branch ghpages
          mkdir -p ghpages/docs
          cp -r docs/* ghpages/docs
          cd ghpages
          touch docs/.nojekyll
          git config --local user.email "action@noreply.github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update documentation" -a || true
          # The above command will fail if no changes were present, so we ignore
          # the return code.
          
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: ghpages
          directory: ghpages
          github_token: ${{ secrets.GITHUB_TOKEN }}
